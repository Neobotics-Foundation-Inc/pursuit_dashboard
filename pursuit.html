<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pure Pursuit Dashboard</title>
<style>
  /* Neobotics official palette (nb-tokens.ts / neobotics.org/about/branding).
     Light: Halo White dominates. Dark: Tarmac Blue dominates. Red stays a
     hint in both: the header rule, the live dot, primary actions, focus. */
  :root {
    --nb-red: #FF0033;
    --nb-red-bright: #FF1A4A;
    --nb-blue: #1B2036;
    --nb-blue-deep: #13172A;
    --nb-white: #FFFFFF;
    --heading-font: 'Kernel', 'Apotek Extended', 'Space Grotesk', sans-serif;
    --body-font: 'Akzidenz-Grotesk BQ', 'Akzidenz-Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --mono-font: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --radius: 12px;

    /* Light mode: Halo White dominant. */
    --page: #FFFFFF;
    --card: #FFFFFF;
    --header-bg: #1B2036;
    --ink: #1B2036;
    --ink-muted: rgba(27, 32, 54, 0.66);
    --ink-dim: rgba(27, 32, 54, 0.42);
    --line: rgba(27, 32, 54, 0.10);
    --field-bg: #FFFFFF;
    --btn-border: rgba(27, 32, 54, 0.22);
    --btn-hover: #F2F3F6;
    --shadow-card: 0 4px 14px rgba(27, 32, 54, 0.08);
    --shadow-card-lg: 0 12px 32px rgba(27, 32, 54, 0.14);
    --wash-a: rgba(27, 32, 54, 0.05);
    --wash-b: rgba(27, 32, 54, 0.04);
  }

  /* Dark mode: Tarmac Blue dominant. The cards carry the tarmac and the
     page sits one step deeper, so the blue is the surface you actually
     read on rather than only a backdrop. */
  [data-theme="dark"] {
    --page: #13172A;
    --card: #1B2036;
    --header-bg: #13172A;
    --ink: #FFFFFF;
    --ink-muted: rgba(255, 255, 255, 0.72);
    --ink-dim: rgba(255, 255, 255, 0.48);
    --line: rgba(255, 255, 255, 0.12);
    --field-bg: rgba(255, 255, 255, 0.06);
    --btn-border: rgba(255, 255, 255, 0.28);
    --btn-hover: rgba(255, 255, 255, 0.10);
    --shadow-card: 0 4px 14px rgba(0, 0, 0, 0.32);
    --shadow-card-lg: 0 12px 32px rgba(0, 0, 0, 0.44);
    --wash-a: rgba(255, 0, 51, 0.06);
    --wash-b: rgba(255, 255, 255, 0.03);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--body-font);
    background: var(--page);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100dvh;
    transition: background 180ms ease-out, color 180ms ease-out;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(700px 480px at 90% 0%, var(--wash-a), transparent 65%),
      radial-gradient(560px 420px at 0% 100%, var(--wash-b), transparent 60%);
  }
  .mono, .stat b, #detail, #loginfo, select { font-family: var(--mono-font); font-variant-numeric: tabular-nums; }

  /* Header: tarmac in light, one step deeper in dark. Red rule in both. */
  header {
    background: var(--header-bg);
    border-bottom: 2px solid var(--nb-red);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header img.logo { height: 42px; display: block; }
  header .divider { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.16); }
  header h1 {
    font-family: var(--heading-font);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--nb-white);
  }
  header h1 .thin { font-weight: 400; color: rgba(255, 255, 255, 0.72); }

  .stats { margin-left: auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; line-height: 1.25; }
  .stat i {
    font-style: normal;
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
  }
  .stat b { font-size: 0.9rem; font-weight: 600; color: var(--nb-white); }
  .stat u { text-decoration: none; color: rgba(255, 255, 255, 0.45); font-size: 0.7rem; }

  main { padding: 20px 22px 28px; max-width: 1680px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: minmax(360px, 460px) 1fr 264px; gap: 16px; margin-bottom: 16px; align-items: start; }
  @media (max-width: 1180px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow-card);
    transition: box-shadow 200ms ease-out, background 180ms ease-out, border-color 180ms ease-out;
  }
  .card:hover { box-shadow: var(--shadow-card-lg); }
  @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } }
  .card-title {
    font-family: var(--heading-font);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .live::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--nb-red);
    display: inline-block;
    box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.16);
  }
  .card-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .card-head .card-title { margin-bottom: 0; }

  /* The plot surface stays a dark instrument panel in both themes: the
     script draws these light-on-dark. */
  canvas { background: var(--nb-blue-deep); border-radius: 8px; width: 100%; display: block; }
  [data-theme="dark"] canvas { border: 1px solid rgba(255, 255, 255, 0.07); }

  #form label {
    display: block;
    margin-top: 11px;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
  }
  #form label:first-child { margin-top: 0; }
  #form input {
    width: 100%;
    margin-top: 4px;
    background: var(--field-bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--ink);
    font-family: var(--mono-font);
    font-size: 0.85rem;
    padding: 5px 8px;
  }
  #form input:focus { outline: none; border-color: var(--nb-red); box-shadow: 0 0 0 3px rgba(255, 0, 51, 0.14); }
  #form input[type=range] { accent-color: var(--nb-red); border: none; padding: 0; box-shadow: none; background: transparent; }
  #form b { color: var(--nb-red); font-family: var(--mono-font); font-size: 0.8rem; }

  .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .btn {
    background: transparent;
    border: 1px solid var(--btn-border);
    color: var(--ink);
    font-family: var(--body-font);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 140ms ease-out, border-color 140ms ease-out;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn.primary { background: var(--nb-red); border-color: var(--nb-red); color: var(--nb-white); }
  .btn.primary:hover { background: var(--nb-red-bright); border-color: var(--nb-red-bright); }
  /* Reset is destructive, so it carries the brand red in both themes. */
  .btn.danger, header .btn.danger { background: var(--nb-red); border-color: var(--nb-red); color: var(--nb-white); }
  .btn.danger:hover, header .btn.danger:hover { background: var(--nb-red-bright); border-color: var(--nb-red-bright); }
  header .btn { border-color: rgba(255, 255, 255, 0.28); color: var(--nb-white); }
  header .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.5); }
  /* One button, two labels. The word comes from CSS so it is correct on
     first paint without waiting for script. */
  .theme-btn::after { content: "Dark"; }
  [data-theme="dark"] .theme-btn::after { content: "Light"; }
  select {
    background: var(--field-bg);
    border: 1px solid var(--btn-border);
    color: var(--ink);
    font-size: 0.78rem;
    padding: 6px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .readout { font-size: 0.76rem; color: var(--ink-muted); margin-top: 10px; }
  .card-head .readout { margin-top: 0; }
  /* Pure Pursuit specifics on top of the shared Neobotics theme. */
  .grid { grid-template-columns: 1fr 300px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  canvas { max-width: 620px; }
</style>
<script>
  /* Applied before first paint, so a dark session never flashes white. */
  (function () {
    var saved = localStorage.getItem("wf-theme");
    if (!saved) {
      saved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = saved;
  })();
  function toggleTheme() {
    var el = document.documentElement;
    el.dataset.theme = el.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("wf-theme", el.dataset.theme);
  }
</script>
</head>
<body>

<header>
  <img class="logo" alt="Neobotics" src="data:image/webp;base64,UklGRqoGAABXRUJQVlA4WAoAAAAQAAAAjwAAjwAAQUxQSGEDAAABoEXbtilJOmGUbdu2bduutm3b7rJt27Zt21XhiNOIt9/LO879rYqICaAn/n8sRrvbk+Jum0787YYtXprSK77zaiTLyCAr+D3p0/ULqxhoppGqN5XYl1Uj77GSv5E+U61SItxOIxVuKHEkl0ZeZCVH2vXhmadEtBvps/glJU7l18jABBQLGEbMTHJCdq/PizqkcU5meEydeklrP38fi/cnuPrSVeDqKTmlyX8KCjYnQ/cf2Pmi2KcML/VJ0zUKHchmRAX3QrPcUNr12OskrG0Yw3/aAOr2EHma4Kq3odtVpclxCIp0JNQzDLhaGnud4fVppGkZhI7nhajwAaNFXsi3GPuEpP2B4XEOjHo9MniF4FJXoAf1pcm0A4r3IZPeUcluVsKGMrwzkzT1HkDnipihYoeTrEoNuaZhP5K0HzM802WK+gb/9y7BBc9AodbSpFmHPU3mfeOY+W5NrHsMOpxTmiq3oaulLaCSx5g3pYPsIxkeYZfmNYYX+6ygQSH+nOCch6FYdxLWtxh7jSz1Tw40wFqFoNMFpCl9BbpVxRoqPzUL9iPDU53SPMXw2jQWOXI7oEw7oMRgEtY1A/uIlKz3ALpcUppCZ6H7ddX4mOGFXml6xaBtGSB7bqdFadZir5Cw9jEMf0twuok1LKp8C7pVWZrcR6FAM6zq3fnprHmF4TWppWkXhvZnw97g6EuWeBdiH5K0vzL8pw3yL2M+V8mKkpeh+3WlybIHinQkuNx1Zp6VxoJBCWh7RmkaP4KO58GeZ2aOPGfOOYXh70naLxge54A88/7Hp8ubyn8KCraQJt0mKN6b4OKXkvC01Ga6RqGD2aWpcRc6VxgblEgWfsqEbRjDw2zSvMPwDBfkmsqGJ8tg2Q9C0S4krH8F9hTBhc4Y8SQ/1CIIncovTfnr0JXSWK8YEBoEfcfwJKc0zzO82Ac5xjJ6rCSQYTuUGEjCeuZhrxGc5zjE43xGde5Dl4pLk336pg3GG5eXxTpGsMAbteslrf07w/M90jhSwX47ZPuLTUYChlHsJdJn9gNmLL5RUSMtg0qsSqWRH1nJ90mfmXcpca+2Rho+VGJrBo18wUp+Q/pMv1mJ+w01UuueEqO8GvmQFQxPykX6dH26YmlKLxnZOQ1p1Ob2pLjbTk/8/1iMAFZQOCAiAwAA0BYAnQEqkACQAD4pFIhCoaEhE8jclBgChKbuFyi/hPgGnWdf/F39kv9v0+O0PdX9m/8ly6Z0elz7p/Nv1h/un//7gHmAfqj/P/zJ7SHmA/Sn/b/5n3qPQB6AH6IdZH6AH8O/ovpZf5j/KfCD+13/G/xfwC/xf+o/fn3AHVcFMlp6nJ0fT/rn8cncpWhwl6MqnIjvR5I0hpbpDoWHQD4cHCBuALUWdmw2z5yN0pfjGMiNEWfaI230/65/KhcKGyAA/v/V+gnP/y271VsLk308+w/y1/gRPw+72cSO4IPehYLhBD/FUsniR4MX267/O32vxbgDwudwboraO7y5QEM8o0I2RmfXgut7n1x66jv7OmitBP8qYhqzZZ+tl+zFKzHwIZjELele+q7X/11ioz5x3zJWTLlfJ+hb4uy4vdb1kXdtjLUPt3rN0bwWVX3ampW/HTMoVidqADBKPP/FIYW8zwmChtcKs01fB4uyoAT4CqNUGfPc1cW/ic0cAM8ZQXrjFm4z9lzXbUR4nObxpKKjzYMiROSaw42lf6kkmwR0r2DZgLLAfcSgDlkSxiiQaEKkTZ0BoYOH4rC//nWbVi13+L70+I5VWyWrWD6GbM2+rHHJCMZkthoojy/9UiD//wjKVAbvavZRt2Y5npsi9qG3vmrtLlL/qePgDBKMgRKZ8ms8bZS1uYI1fcqHNBdyZFf8Z97fAO3PrwMRRILJ   <div class="divider" aria-hidden="true"></div>
  <h1>NeoRacer <span class="thin">Pure Pursuit</span></h1>
  <div class="stats">
    <span class="stat"><i>model</i><b id="model">?</b></span>
    <span class="stat"><i>camera</i><b><span id="fps">?</span> <u>fps</u></b></span>
    <span class="stat"><i>target</i><b id="tgt">none</b></span>
    <span class="stat"><i>error</i><b id="err">?</b></span>
    <span class="stat"><i>steer</i><b id="steer">?</b></span>
    <span class="stat"><i>throttle</i><b id="thr">?</b></span>
    <button class="btn theme-btn" onclick="toggleTheme()" title="Switch between light and dark"></button>
    <button class="btn danger" onclick="reset()" title="Re-read pursuit.yaml">Reset</button>
  </div>
</header>

<main>
<div class="grid">
  <section class="card">
    <div class="card-title"><span class="live"></span>Camera</div>
    <canvas id="cam" width="640" height="480"></canvas>
    <div class="readout" id="detail"></div>
  </section>
  <section class="card">
    <div class="card-title">Tune</div>
    <div id="form"></div>
    <div class="actions">
      <button class="btn primary" onclick="apply()">Apply</button>
      <button class="btn" onclick="post('/save')">Save</button>
      <button class="btn" onclick="reset()">Load</button>
    </div>
  </section>
</div>
</main>

<script>
const FIELDS = ['speed', 'speed_kp', 'safety_area', 'angle_kp', 'angle_kd',
                'score_threshold', 'max_detections'];
const UNITS = {
  speed: '0 to 1 throttle cap', speed_kp: 'stopping gain',
  safety_area: 'stop at this bbox area, 0..1 of image',
  angle_kp: 'steer per unit offset', angle_kd: 'steering damper',
  score_threshold: 'ignore detections below, 0..1',
  max_detections: 'keep this many best scores',
};
const STEPS = { speed_kp: '0.01', angle_kp: '0.01', angle_kd: '0.01',
                safety_area: '0.01', score_threshold: '0.05', max_detections: '1' };

const c = document.getElementById('cam'), ctx = c.getContext('2d');
const img = new Image();
let last = null;
img.onload = draw;

// Pull frames one at a time so a congested link drops frame rate instead
// of building a lag queue. Pauses when the tab is hidden.
(function liveLoop() {
  if (document.hidden) { setTimeout(liveLoop, 250); return; }
  const t = Date.now();
  const done = () => {
    img.removeEventListener('load', done); img.removeEventListener('error', done);
    setTimeout(liveLoop, Math.max(20, 160 - (Date.now() - t)));
  };
  img.addEventListener('load', done); img.addEventListener('error', done);
  img.src = '/frame?' + t;
})();

function post(path, body) {
  return fetch(path, { method: 'POST', body: body ? JSON.stringify(body) : null });
}

function reset() {
  post('/load').then(() => { document.getElementById('form').dataset.built = ''; });
}

function apply() {
  const out = {};
  for (const f of FIELDS) out[f] = parseFloat(document.getElementById('in_' + f).value);
  post('/params', out);
}

function buildForm(params) {
  const form = document.getElementById('form');
  if (form.dataset.built) return;  // rebuild only on Reset/Load so typing survives
  form.dataset.built = '1';
  form.innerHTML = FIELDS.map(f => f === 'speed'
    ? `<label>speed (${UNITS.speed}) <b id="speedval">${params.speed}</b>
       <input id="in_speed" type="range" min="0" max="1" step="0.01" value="${params.speed}"
        oninput="document.getElementById('speedval').textContent = this.value;
                 post('/params', {speed: parseFloat(this.value)})"></label>`
    : `<label>${f} (${UNITS[f]})<input id="in_${f}" type="number" step="${STEPS[f] || 'any'}" value="${params[f]}"></label>`
  ).join('');
}

function draw() {
  ctx.drawImage(img, 0, 0, c.width, c.height);
  if (!last) return;
  const [W, H] = last.res[0] ? last.res : [c.width, c.height];
  const sx = c.width / W, sy = c.height / H;
  ctx.font = '13px Helvetica'; ctx.lineWidth = 2;
  for (const d of last.detections) {
    const isTgt = last.target && d.cx === last.target.cx && d.cy === last.target.cy;
    ctx.strokeStyle = isTgt ? '#FF0033' : 'rgba(245, 245, 247, 0.6)';
    ctx.strokeRect((d.cx - d.w / 2) * sx, (d.cy - d.h / 2) * sy, d.w * sx, d.h * sy);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fillText(`${d.label} ${d.score < 1 ? d.score : ''}`,
                 (d.cx - d.w / 2) * sx + 3, (d.cy - d.h / 2) * sy - 4);
  }
  // Safety area reference: a centered box of the stop size. When the red
  // target box grows past this outline, the car is fully stopped.
  const p = last.params;
  const aw = Math.sqrt(p.safety_area * 4 / 3) * c.width * 0.866;
  const ah = aw * 0.75;
  ctx.strokeStyle = '#FFD700'; ctx.setLineDash([6, 4]);
  ctx.strokeRect((c.width - aw) / 2, (c.height - ah) / 2, aw, ah);
  ctx.setLineDash([]);
  // Center line the steering chases
  ctx.strokeStyle = 'rgba(245, 245, 247, 0.35)';
  ctx.beginPath(); ctx.moveTo(c.width / 2, 0); ctx.lineTo(c.width / 2, c.height); ctx.stroke();
}

function update() {
  fetch('/state').then(r => r.json()).then(d => {
    last = d;
    document.getElementById('model').textContent = d.model;
    document.getElementById('fps').textContent = d.cam_fps;
    document.getElementById('tgt').textContent = d.target
      ? `${d.target.label} (area ${(d.area * 100).toFixed(1)}%)` : 'none';
    document.getElementById('err').textContent = d.error ?? '?';
    document.getElementById('steer').textContent = d.steer;
    document.getElementById('thr').textContent = d.speed_cmd;
    buildForm(d.params);
    document.getElementById('detail').textContent =
      `${d.detections.length} detection(s). Yellow dashes: stop size (safety_area). ` +
      `Red box: the target being chased. No target: the last command keeps driving.`;
  }).catch(() => {});
}

update();
setInterval(update, 200);
</script>
</body>
</html>
