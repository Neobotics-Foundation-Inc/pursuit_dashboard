# Pure Pursuit Dashboard parameters.
# Switch mode by editing this file, then press Reset or Load on the
# dashboard (or restart the service). There is no UI toggle for mode.
mode: 0               # 0 = follow AR tags, 1 = follow cars (YOLO detections)

speed: 0.0            # top throttle 0..1. Ships at 0.0: the neoracer mux has
                      # no ROS deadman (the transmitter SWB switch is the
                      # gate), so nothing drives until you raise it.
speed_kp: 0.2         # throttle ramp toward the target speed. This is the
                      # stopping gain: higher brakes and accelerates harder.
safety_area: 0.15     # bbox area as a fraction of the image (0..1) where the
                      # car fully stops. Braking starts as the box grows
                      # toward this size.
angle_kp: 1.0         # steering strength on the target's horizontal offset
angle_kd: 0.1         # steering damper. Raise this if the car wobbles.
score_threshold: 0.5  # cars mode: ignore detections scored below this (0..1).
                      # AR tag detection is exact, so tags ignore this.

# Which topics to read. Latest driver: /camera/color. Older cars: /camera.
camera_topic: /camera/color
detections_topic: /edgetpu/inference

preview_width: 320    # live view width sent to the browser, pixels
preview_quality: 45   # live view jpeg quality 1..100
